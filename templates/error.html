<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Error - AONIK HOSTING</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#07090e] text-white flex items-center justify-center p-6">
  <div class="text-center max-w-md bg-[#0d101a] border border-gray-800 p-8 rounded-3xl">
    <div class="text-5xl font-black text-rose-500 mb-2">{{ code or 404 }}</div>
    <h2 class="text-xl font-bold mb-2">Error Occurred</h2>
    <p class="text-sm text-gray-400 mb-6">{{ message or "Requested page was not found on this node." }}</p>
    <a href="/home" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold">Back to Dashboard</a>
  </div>
</body>
</html>
