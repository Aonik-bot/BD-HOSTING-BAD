<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AONIK HOSTING Cloud Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090e; color: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-[#0d101a] border border-blue-900/30 rounded-3xl p-8 shadow-2xl shadow-black/80">
    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-blue-600/30 mb-3">
        <i class="fa-solid fa-cloud text-2xl"></i>
      </div>
      <h2 class="text-2xl font-black text-white">AONIK <span class="text-blue-400">HOSTING</span></h2>
      <p class="text-xs text-gray-400 mt-1">Sign in to manage your cloud bots and servers</p>
    </div>

    {% if error %}
    <div class="mb-4 bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs px-4 py-3 rounded-xl">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Username or Email</label>
        <input type="text" name="username" value="html@gmail" required class="w-full bg-[#131724] border border-gray-800 focus:border-blue-500 text-white rounded-xl px-4 py-3 text-sm outline-none transition font-mono">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Password</label>
        <input type="password" name="password" value="password123" required class="w-full bg-[#131724] border border-gray-800 focus:border-blue-500 text-white rounded-xl px-4 py-3 text-sm outline-none transition font-mono">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 mt-2">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Console
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-gray-800/80 text-center text-xs text-gray-500">
      Admin Default: <span class="text-blue-400 font-mono">html@gmail</span> / <span class="text-blue-400 font-mono">password123</span>
    </div>
  </div>
</body>
</html>
