<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - AONIK HOSTING</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090e; color: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-[#0c101a] border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-lg font-bold text-white">AONIK <span class="text-blue-400">ADMIN</span></span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs bg-blue-500/20 text-blue-300 px-3 py-1 rounded-full font-mono">{{ user.username }} ({{ user.role }})</span>
      <a href="/logout" class="text-rose-400 hover:text-rose-300 text-xs font-semibold bg-rose-500/10 px-3 py-1.5 rounded-lg">Logout</a>
    </div>
  </header>

  <main class="p-6 max-w-7xl mx-auto space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-[#0e121d] border border-gray-800 p-5 rounded-2xl">
        <div class="text-xs text-gray-400">Total Users</div>
        <div class="text-2xl font-black text-white mt-1">{{ users|length }}</div>
      </div>
      <div class="bg-[#0e121d] border border-gray-800 p-5 rounded-2xl">
        <div class="text-xs text-gray-400">Total Servers</div>
        <div class="text-2xl font-black text-blue-400 mt-1">{{ servers|length }}</div>
      </div>
      <div class="bg-[#0e121d] border border-gray-800 p-5 rounded-2xl">
        <div class="text-xs text-gray-400">Platform Status</div>
        <div class="text-sm font-bold text-emerald-400 mt-2 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> 100% Operational
        </div>
      </div>
      <div class="bg-[#0e121d] border border-gray-800 p-5 rounded-2xl">
        <div class="text-xs text-gray-400">Server Cluster</div>
        <div class="text-sm font-mono text-gray-300 mt-2">Asia-South (BD-01)</div>
      </div>
    </div>
  </main>
</body>
</html>
